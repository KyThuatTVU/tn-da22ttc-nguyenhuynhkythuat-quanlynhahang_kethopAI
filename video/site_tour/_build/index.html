<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ẩm Thực Phương Nam — Giới thiệu website</title>
<link rel="stylesheet" href="assets/fonts/be-vietnam.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#FFF7EF;
    font-family:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;color:#2A211B;
    background:
      radial-gradient(1000px 680px at 8% -6%,#FFE7D2 0%,rgba(255,231,210,0) 62%),
      radial-gradient(920px 720px at 98% 104%,#E4F3E8 0%,rgba(228,243,232,0) 64%),
      linear-gradient(155deg,#FFFAF4 0%,#FFF2E4 52%,#FFFAF5 100%)}
  #bg{position:absolute;inset:0;overflow:hidden}
  #bg .grid{position:absolute;inset:-40px;
    background-image:linear-gradient(rgba(190,120,70,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(190,120,70,.055) 1px,transparent 1px);
    background-size:70px 70px;
    mask-image:radial-gradient(1200px 800px at 50% 42%,#000 12%,transparent 78%)}
  #bg .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  #bg .g1{width:720px;height:720px;left:-220px;top:-260px;background:radial-gradient(circle,rgba(232,98,44,.22),transparent 68%)}
  #bg .g2{width:820px;height:820px;right:-300px;bottom:-360px;background:radial-gradient(circle,rgba(47,125,79,.18),transparent 70%)}
  #bg .vig{position:absolute;inset:0;background:radial-gradient(125% 95% at 50% 45%,transparent 58%,rgba(120,70,30,.10) 100%)}
  .scene{position:absolute;inset:0;opacity:0;visibility:hidden}
  .scene.on{opacity:1;visibility:visible}

  .kicker{position:absolute;font-size:20px;font-weight:700;letter-spacing:4px;color:#E8622C}
  .h1{position:absolute;font-weight:800;letter-spacing:-1.4px;line-height:1.06;color:#2A211B}
  .sub{position:absolute;font-size:26px;line-height:1.45;color:#7A6658;font-weight:500}
  .small{font-size:20px;color:#8A7566;font-weight:500}
  .accent{color:#E8622C}
  .green{color:#2F7D4F}
  .card{background:#fff;border:1px solid rgba(226,120,70,.14);border-radius:20px;
    box-shadow:0 24px 60px rgba(120,60,20,.10)}
  .chip{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1.5px solid rgba(232,98,44,.28);
    border-radius:999px;color:#3A2A20;font-weight:700;letter-spacing:.3px;box-shadow:0 8px 22px rgba(120,60,20,.08)}
  .chip.g{background:#EEF8F1;border-color:rgba(47,125,79,.3);color:#25603C}
  .browser{position:absolute;background:#fff;border-radius:18px;overflow:hidden;
    border:1px solid rgba(120,70,40,.14);box-shadow:0 34px 80px rgba(90,40,10,.18)}
  .bbar{position:absolute;left:0;top:0;right:0;height:44px;background:#F6EEE6;
    display:flex;align-items:center;padding:0 18px;gap:9px;border-bottom:1px solid rgba(120,70,40,.08)}
  .bdot{width:11px;height:11px;border-radius:50%}
  .burl{position:absolute;left:50%;transform:translateX(-50%);height:27px;min-width:560px;
    background:#fff;border-radius:8px;border:1px solid rgba(120,70,40,.09);
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:13.5px;color:#8A7566;font-weight:500;padding:0 16px}
  .bshot{position:absolute;left:0;right:0;top:44px;bottom:0;overflow:hidden;background:#fff}
  .bshot img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top center}
  .callout{position:absolute;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.97);
    border:1.5px solid rgba(232,98,44,.4);border-radius:999px;padding:8px 18px 8px 9px;
    font-size:17px;font-weight:700;color:#3A2A20;white-space:nowrap;
    box-shadow:0 14px 34px rgba(120,60,20,.18);opacity:0}
  .callout .n{width:27px;height:27px;border-radius:50%;background:#E8622C;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:0 0 auto}
  .callout.green{border-color:rgba(47,125,79,.4)}
  .callout.green .n{background:#2F7D4F}
  .hl{position:absolute;border:3px solid rgba(232,98,44,.92);border-radius:14px;opacity:0;
    box-shadow:0 0 0 7px rgba(232,98,44,.13),0 10px 30px rgba(232,98,44,.16)}
  .hl.green{border-color:rgba(47,125,79,.92);box-shadow:0 0 0 7px rgba(47,125,79,.13)}
  .cursor{position:absolute;width:20px;height:20px;border-radius:50%;background:#E8622C;
    border:3px solid #fff;box-shadow:0 6px 16px rgba(120,40,10,.35);z-index:30;opacity:0}
  .ripple{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid rgba(232,98,44,.8);z-index:29;opacity:0}
  .btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:10px;
    background:#E8622C;color:#fff;font-weight:700;border-radius:13px;font-size:20px;
    box-shadow:0 14px 30px rgba(232,98,44,.30)}
  .btn.green{background:#2F7D4F;box-shadow:0 14px 30px rgba(47,125,79,.25)}
  .money{color:#E8622C;font-weight:800;font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}
  .phone{position:absolute;border-radius:44px;background:#1E1B18;padding:12px;
    box-shadow:0 40px 90px rgba(40,20,10,.35)}
  .phone .scr{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#EAF4D9}
  .phone .scr img{width:100%;height:100%;object-fit:cover}
  .toast{position:absolute;display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;
    border:1px solid rgba(47,125,79,.25);box-shadow:0 18px 40px rgba(40,60,30,.18);
    padding:12px 20px;font-size:18px;font-weight:700;color:#25603C;opacity:0}
  .toast .ic{width:30px;height:30px;border-radius:50%;background:#2F7D4F;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
  #hud{position:absolute;inset:0;pointer-events:none;z-index:60}
  #brand{position:absolute;left:48px;top:26px;display:flex;align-items:center;gap:12px}
  #brand img{width:46px;height:46px;border-radius:50%;box-shadow:0 8px 18px rgba(40,70,40,.25)}
  #brand .bt{font-size:13px;font-weight:800;letter-spacing:3.2px;color:#7A6658}
  #brand .bs{font-size:11px;font-weight:600;letter-spacing:2px;color:#B39C88;margin-top:3px}
  #idx{position:absolute;right:52px;top:32px;font-size:15px;letter-spacing:2px;color:#A08A78}
  #idx b{color:#E8622C;font-size:20px}
  #prog{position:absolute;left:0;top:0;height:4px;width:0;z-index:70;
    background:linear-gradient(90deg,#E8622C,#F2B544,#2F7D4F)}
  #sweep{position:absolute;inset:0;z-index:55;opacity:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.55) 48%,rgba(255,246,236,.15) 56%,transparent 67%)}
  #subs{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;z-index:80}
  #subBox{position:relative;max-width:1600px;background:rgba(42,30,22,.90);border-radius:14px;
    border:1px solid rgba(255,255,255,.12);padding:9px 32px 11px;color:#FFF9F2;
    font-size:34px;font-weight:600;line-height:1.3;text-align:center;letter-spacing:.1px;
    box-shadow:0 16px 44px rgba(40,20,10,.30);opacity:0}
  #subBox .bar{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:14px 0 0 14px;background:#E8622C}
  #subText{white-space:pre-line}
  .dash{position:absolute;border:2px dashed rgba(232,98,44,.35);border-radius:14px}
  .stars{color:#F2B544;letter-spacing:2px}
  .divider{position:absolute;height:1px;background:rgba(120,70,40,.14)}
  .label{font-weight:700;letter-spacing:.4px}
  .kpi{font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="grid" id="bggrid"></div><div class="glow g1"></div><div class="glow g2"></div><div class="vig"></div></div>
  <div id="scenes"></div>
  <div id="sweep"></div>
  <div id="subs"><div id="subBox"><div class="bar"></div><span id="subText"></span></div></div>
  <div id="hud">
    <div id="brand"><img src="assets/logo.png" alt=""><div><div class="bt">ẨM THỰC PHƯƠNG NAM</div><div class="bs">HƯƠNG VỊ VĨNH LONG</div></div></div>
    <div id="idx"><b id="idxNum">01</b> / 13</div>
    <div id="prog"></div>
  </div>
</div>
<script src="data.js"></script>
<script src="scenes.js"></script>
</body>
</html>
