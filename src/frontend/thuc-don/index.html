<!DOCTYPE html>
<html lang="vi">

<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Đơn - Nhà hàng Phương Nam Vĩnh Long</title>
    <link rel="icon" type="image/png" href="images/Green Simple Clean Vegan Food Logo.png">
    <!-- Tailwind CSS - Development CDN (Warning is expected in dev environment) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/modern-style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/loading.css">
    
    <link rel="stylesheet" href="css/thuc-don.css">

</head>

<body class="bg-gradient-to-br from-orange-50 via-red-50 to-yellow-50" style="padding-top: 80px;">
    <!-- Navigation Container -->
    <div id="navbar-container"></div>
    <!-- Page Header -->
    <section
        class="relative w-full text-white overflow-hidden h-[140px] sm:h-[160px] md:h-[180px] lg:h-[200px] flex items-center justify-center text-center bg-[#d1b6a1]">
        <!-- Background Image -->
        <div class="absolute inset-0 opacity-70" style="background-image: url('images/cau-long-bien.jpg');
              background-size: cover;
              background-position: center;
              filter: sepia(90%) brightness(90%) contrast(85%);">
        </div>

        <!-- Nền nâu nhẹ phủ -->
        <div class="absolute inset-0 bg-[#c9a988]/50"></div>

        <!-- Nội dung chữ -->
        <div class="relative z-10 px-4">
            <h1
                class="font-dancing text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold mb-3 sm:mb-4 drop-shadow-lg text-[#4b2c16]">
                Thực đơn
            </h1>
            <p class="text-base sm:text-lg md:text-xl lg:text-2xl font-light text-[#5b3a1e]">
                Hương vị từ miền sông nước
            </p>
        </div>
    </section>


    <!-- Menu Section -->
    <section class="py-6 sm:py-8 md:py-12">
        <div class="container mx-auto px-4">
            <!-- Search Bar -->
            <div class="mb-4 sm:mb-6">
                <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm">
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="Tìm kiếm món ăn..."
                            class="w-full px-4 sm:px-5 py-2 sm:py-3 pl-10 sm:pl-12 text-sm sm:text-base border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition">
                        <i
                            class="fas fa-search absolute left-3 sm:left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm sm:text-base"></i>
                        <button id="clear-search"
                            class="absolute right-3 sm:right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-orange-600 transition hidden">
                            <i class="fas fa-times text-sm sm:text-base"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col lg:flex-row gap-8">
                <!-- Mobile Filter Toggle Button -->
                <button id="mobile-filter-toggle"
                    class="lg:hidden w-full bg-white rounded-xl p-4 shadow-sm flex items-center justify-between mb-4">
                    <span class="font-semibold text-gray-800">
                        <i class="fas fa-filter mr-2"></i>Bộ lọc & Sắp xếp
                    </span>
                    <i class="fas fa-chevron-down transition-transform" id="filter-icon"></i>
                </button>

                <!-- Sidebar Filters -->
                <div class="lg:w-1/4">
                    <div id="filter-sidebar"
                        class="bg-white rounded-xl p-6 shadow-sm lg:sticky lg:top-24 hidden lg:block">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-xl">Bộ lọc</h3>
                            <button id="mobile-filter-close" class="lg:hidden text-gray-500 hover:text-gray-700">
                                <i class="fas fa-times text-xl"></i>
                            </button>
                        </div>

                        <!-- Category Filter -->
                        <div class="mb-6">
                            <h4 class="font-medium mb-3">Danh mục</h4>
                            <div class="space-y-2">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="category" value="all" class="w-4 h-4 text-orange-600" checked>
                                    <span class="ml-2 text-gray-700">Tất cả</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="category" value="canh-sup" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">Canh & Súp</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="category" value="hai-san" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">Hải sản</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="category" value="thit" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">Thịt</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="category" value="rau" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">Rau</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="category" value="com" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">Cơm</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="category" value="do-uong" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">Đồ uống</span>
                                </label>
                            </div>
                        </div>

                        <!-- Price Filter -->
                        <div class="mb-6">
                            <h4 class="font-medium mb-3">Khoảng giá</h4>
                            <div class="space-y-2">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="price" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">Dưới 100.000đ</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="price" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">100.000đ - 200.000đ</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="price" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">200.000đ - 500.000đ</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="price" class="w-4 h-4 text-orange-600">
                                    <span class="ml-2 text-gray-700">Trên 500.000đ</span>
                                </label>
                            </div>
                        </div>

                        <!-- Rating Filter -->
                        <div class="mb-6">
                            <h4 class="font-medium mb-3">Đánh giá</h4>
                            <div class="space-y-2">
                                <label class="flex items-center cursor-pointer">
                                    <input type="checkbox" class="w-4 h-4 text-orange-600 rounded">
                                    <span class="ml-2 text-yellow-400">
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                    </span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="checkbox" class="w-4 h-4 text-orange-600 rounded">
                                    <span class="ml-2 text-yellow-400">
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                        <i class="far fa-star"></i>
                                    </span>
                                </label>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <button
                                class="flex-1 bg-orange-600 text-white py-2 rounded-lg hover:bg-orange-700 transition"
                                id="apply-filter">
                                Áp dụng
                            </button>
                            <button
                                class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 transition"
                                id="reset-filter">
                                Đặt lại
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="lg:w-3/4">
                    <!-- Sort Bar -->
                    <div class="bg-white rounded-xl p-4 mb-6 shadow-sm flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <h2 class="text-lg font-semibold text-gray-800">Danh sách món ăn</h2>
                            <span class="text-gray-500 text-sm">(<strong id="product-count" class="text-orange-600">0</strong> món)</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-sm text-slate-600 font-medium">Sắp xếp:</label>
                            <select id="sort-select" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm text-slate-700 focus:outline-none focus:border-orange-500">
                                <option value="newest">Mới nhất</option>
                                <option value="popular">Phổ biến nhất (AI)</option>
                                <option value="rating">Đánh giá cao nhất</option>
                                <option value="clicks">Click nhiều nhất</option>
                                <option value="views">Xem lâu nhất (>50s)</option>
                                <option value="orders">Mua nhiều nhất</option>
                                <option value="likes">Thả tim nhiều nhất</option>
                                <option value="price_asc">Giá: Thấp đến Cao</option>
                                <option value="price_desc">Giá: Cao đến Thấp</option>
                            </select>
                        </div>
                        <div class="hidden">
                            <span id="product-count-mobile"></span>
                        </div>
                    </div>

                    <!-- Products -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 lg:gap-6"
                        id="menu-products">
                        <!-- Product items will be rendered here by JavaScript -->
                    </div>

                    <!-- Pagination -->
                    <div class="flex justify-center mt-8 space-x-1 sm:space-x-2" id="pagination-container">
                        <!-- Pagination will be rendered by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>



    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Chatbot Container -->
    <div id="chatbot-container"></div>

    <!-- Back to Top Button -->
    <button id="back-to-top" 
        class="fixed bottom-4 left-8 bg-gradient-to-r from-orange-500 to-orange-600 text-white w-14 h-14 rounded-full shadow-2xl hover:shadow-3xl flex items-center justify-center border-2 border-white opacity-0 invisible transition-all duration-300 hover:scale-110"
        style="z-index: 99999 !important;"
        aria-label="Back to top">
        <i class="fas fa-arrow-up text-xl"></i>
    </button>

    

    
    <script src="js/thuc-don.js" defer></script>


    <!-- Scripts -->
    <script src="js/loading.js?v=3.1"></script>
    <script src="js/main.js?v=3.1"></script>
    <script src="js/cart.js?v=3.1"></script>
    <script src="js/recommendation.js?v=3.1"></script>
    <script src="js/menu.js?v=3.1"></script>
    <script src="js/notifications.js?v=3.1"></script>
    <script src="js/load-components.js?v=3.1"></script>
    <script src="js/cart-test.js?v=3.1"></script>

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
    
    <!-- Snow Effect -->
    <script src="js/snow-effect.js"></script>
    
  
   
</body>

</html>
