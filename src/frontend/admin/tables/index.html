<!DOCTYPE html>
<html lang="vi">
<head>
    <base href="/admin/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý bàn - Admin Phương Nam</title>
    <link rel="icon" type="image/png" href="../images/Green Simple Clean Vegan Food Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="admin-responsive.css">
    <link rel="stylesheet" href="admin-glass-3d.css">
    
    <link rel="stylesheet" href="tables.css">

</head>
<body>
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Placeholder -->
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Sidebar Overlay -->
            <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
            
            <!-- Header Placeholder -->
            <div id="header-placeholder"></div>

            <main class="flex-1 overflow-y-auto p-6 scroll-smooth">
                <!-- KPI Bàn -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="tables-kpi">
                    <!-- Sẽ được fill bằng JS -->
                    <div class="kpi-card kpi-blue"><div class="animate-pulse flex items-center gap-4"><div class="w-14 h-14 bg-slate-200 rounded-2xl"></div><div class="space-y-2"><div class="h-3 w-20 bg-slate-200 rounded"></div><div class="h-6 w-12 bg-slate-200 rounded"></div></div></div></div>
                    <div class="kpi-card kpi-emerald"><div class="animate-pulse flex items-center gap-4"><div class="w-14 h-14 bg-slate-200 rounded-2xl"></div><div class="space-y-2"><div class="h-3 w-20 bg-slate-200 rounded"></div><div class="h-6 w-12 bg-slate-200 rounded"></div></div></div></div>
                    <div class="kpi-card kpi-amber"><div class="animate-pulse flex items-center gap-4"><div class="w-14 h-14 bg-slate-200 rounded-2xl"></div><div class="space-y-2"><div class="h-3 w-20 bg-slate-200 rounded"></div><div class="h-6 w-12 bg-slate-200 rounded"></div></div></div></div>
                    <div class="kpi-card kpi-indigo"><div class="animate-pulse flex items-center gap-4"><div class="w-14 h-14 bg-slate-200 rounded-2xl"></div><div class="space-y-2"><div class="h-3 w-20 bg-slate-200 rounded"></div><div class="h-6 w-12 bg-slate-200 rounded"></div></div></div></div>
                </div>

                <!-- Section Header -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
                    <div>
                        <h3 class="text-xl font-800 text-slate-800">Sơ đồ bàn ăn</h3>
                        <p class="text-sm text-slate-500 font-medium">Click vào bàn để chỉnh sửa thông tin</p>
                    </div>
                    <div class="flex items-center gap-3 bg-white px-4 py-2 border border-slate-200 rounded-xl shadow-sm">
                        <label class="text-sm font-bold text-slate-600 whitespace-nowrap"><i class="fas fa-filter text-blue-500 mr-1"></i>Khu vực:</label>
                        <select id="area-filter" class="bg-transparent border-none text-sm font-semibold text-slate-700 outline-none cursor-pointer pr-4" onchange="filterManagementTables()">
                            <option value="all">Tất cả khu vực</option>
                        </select>
                    </div>
                </div>

                <!-- Tables Grid -->
                <div id="table-list-body" class="table-grid pb-12">
                    <!-- Sẽ được fill bằng JS -->
                    <div class="col-span-full py-20 text-center text-slate-400">
                        <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
                        <p class="font-medium">Đang khởi tạo sơ đồ bàn...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="tableModal" class="modal">
        <div class="modal-content">
            <div class="modal-header flex justify-between items-center">
                <div>
                    <h3 id="modal-title" class="text-xl font-extrabold italic">Thêm bàn mới</h3>
                    <p class="text-blue-200 text-xs mt-1">Cấu hình thông tin bàn vật lý</p>
                </div>
                <button onclick="closeModal()" class="bg-white/10 hover:bg-white/20 w-10 h-10 rounded-full flex items-center justify-center transition-all">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-8">
                <form id="tableForm">
                    <input type="hidden" id="table-id">
                    
                    <label class="form-label">Tên bàn hiển thị</label>
                    <div class="form-input-wrap">
                        <i class="fas fa-tag"></i>
                        <input type="text" id="table-name" class="form-input" placeholder="VD: Bàn 01, VIP 01..." required>
                    </div>

                    <label class="form-label">Số chỗ ngồi tối đa</label>
                    <div class="form-input-wrap">
                        <i class="fas fa-users"></i>
                        <input type="number" id="table-seats" class="form-input" placeholder="VD: 4" min="1" required>
                    </div>

                    <label class="form-label">Khu vực / Tầng</label>
                    <div class="form-input-wrap">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="table-location" class="form-input" placeholder="VD: Tầng trệt, Tầng 2...">
                    </div>

                    <div id="status-group">
                        <label class="form-label">Trạng thái hiện tại</label>
                        <select id="table-status" class="form-select mb-6">
                            <option value="trong">✅ Trống (Sẵn sàng)</option>
                            <option value="dang_phuc_vu">🔥 Đang phục vụ</option>
                            <option value="da_dat">📅 Đã đặt trước</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-save flex items-center justify-center gap-2">
                        <i class="fas fa-save"></i>
                        <span>Lưu thông tin bàn</span>
                    </button>
                    
                    <button type="button" onclick="closeModal()" class="w-full mt-3 py-3 text-slate-500 font-bold text-sm hover:text-slate-800 transition-all">
                        Hủy bỏ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="admin-layout.js"></script>
    <script src="admin-mobile.js"></script>
    
    <script src="tables.js" defer></script>

</body>
</html>
