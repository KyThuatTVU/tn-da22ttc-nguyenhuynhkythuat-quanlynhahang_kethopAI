<!DOCTYPE html>
<html lang="vi">
<head>
    <base href="/admin/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - Admin</title>
    <link rel="icon" type="image/png" href="../images/Green Simple Clean Vegan Food Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="admin-responsive.css">
    <link rel="stylesheet" href="admin-glass-3d.css">
    
    <link rel="stylesheet" href="orders.css">

</head>
<body>
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Placeholder -->
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Sidebar Overlay -->
            <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
            
            <!-- Header Placeholder -->
            <div id="header-placeholder"></div>

            <main class="flex-1 overflow-y-auto p-4 sm:p-6" style="background: #f0f4f8;">
                <!-- Stats -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-5 mb-5 sm:mb-7">
                    <div class="order-stat-card stat-amber">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-slate-500 text-xs font-medium mb-1">Chờ xác nhận</p>
                                <p id="stat-pending" class="text-2xl sm:text-3xl font-800 text-slate-800">0</p>
                                <p class="text-xs text-amber-600 font-medium mt-1"><i class="fas fa-hourglass-half mr-1"></i>Đang chờ</p>
                            </div>
                            <div class="stat-icon-wrap">
                                <i class="fas fa-clock"></i>
                            </div>
                        </div>
                    </div>
                    <div class="order-stat-card stat-blue">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-slate-500 text-xs font-medium mb-1">Đang xử lý</p>
                                <p id="stat-processing" class="text-2xl sm:text-3xl font-800 text-slate-800">0</p>
                                <p class="text-xs text-blue-600 font-medium mt-1"><i class="fas fa-cog fa-spin mr-1"></i>Xử lý</p>
                            </div>
                            <div class="stat-icon-wrap">
                                <i class="fas fa-spinner"></i>
                            </div>
                        </div>
                    </div>
                    <div class="order-stat-card stat-purple">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-slate-500 text-xs font-medium mb-1">Đang giao</p>
                                <p id="stat-delivering" class="text-2xl sm:text-3xl font-800 text-slate-800">0</p>
                                <p class="text-xs text-purple-600 font-medium mt-1"><i class="fas fa-motorcycle mr-1"></i>Giao hàng</p>
                            </div>
                            <div class="stat-icon-wrap">
                                <i class="fas fa-shipping-fast"></i>
                            </div>
                        </div>
                    </div>
                    <div class="order-stat-card stat-emerald">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-slate-500 text-xs font-medium mb-1">Hoàn thành</p>
                                <p id="stat-delivered" class="text-2xl sm:text-3xl font-800 text-slate-800">0</p>
                                <p class="text-xs text-emerald-600 font-medium mt-1"><i class="fas fa-check-double mr-1"></i>Thành công</p>
                            </div>
                            <div class="stat-icon-wrap">
                                <i class="fas fa-check-circle"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Order Type Tabs -->
                <div class="order-type-tabs">
                    <button class="order-tab-btn active" id="tab-all" onclick="switchOrderTab('all')">
                        <i class="fas fa-list"></i> Tất cả <span class="tab-badge" id="count-all">0</span>
                    </button>
                    <button class="order-tab-btn" id="tab-online" onclick="switchOrderTab('online')">
                        <i class="fas fa-globe"></i> Trực tuyến <span class="tab-badge" id="count-online">0</span>
                    </button>
                    <button class="order-tab-btn" id="tab-pos" onclick="switchOrderTab('pos')">
                        <i class="fas fa-cash-register"></i> Tại nhà hàng (POS) <span class="tab-badge" id="count-pos">0</span>
                    </button>
                </div>

                <!-- Filters -->
                <div class="filter-bar mb-5 sm:mb-7">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4">
                        <div class="filter-input-wrap lg:col-span-1">
                            <i class="fas fa-search"></i>
                            <input type="text" id="search" placeholder="Tìm mã đơn, khách hàng..." class="filter-input">
                        </div>
                        <select id="status-filter" class="filter-select">
                            <option value="">📋 Tất cả trạng thái</option>
                            <option value="pending">⏳ Chờ xác nhận</option>
                            <option value="preparing">🍳 Đang chuẩn bị</option>
                            <option value="delivered">✅ Hoàn thành</option>
                            <option value="cancelled">❌ Đã hủy</option>
                        </select>
                        <select id="payment-filter" class="filter-select">
                            <option value="">💳 Thanh toán</option>
                            <option value="pending">🔴 Chưa thanh toán</option>
                            <option value="success">🟢 Đã thanh toán</option>
                        </select>
                        <div class="filter-input-wrap">
                            <i class="fas fa-calendar-alt"></i>
                            <input type="date" id="date-filter" class="filter-input">
                        </div>
                        <button onclick="applyFilters()" class="btn-filter justify-center">
                            <i class="fas fa-filter"></i>
                            <span>Lọc kết quả</span>
                        </button>
                    </div>
                </div>

                <!-- Orders Table -->
                <div class="orders-table-wrap">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr>
                                    <th class="text-left">Mã đơn</th>
                                    <th class="text-left">Nguồn</th>
                                    <th class="text-left">Khách hàng</th>
                                    <th class="text-left">Ngày đặt</th>
                                    <th class="text-left">Tổng tiền</th>
                                    <th class="text-left">Thanh toán</th>
                                    <th class="text-left">Trạng thái</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="orders-tbody">
                                <tr>
                                    <td colspan="7" class="text-center" style="padding: 60px 20px;">
                                        <div class="empty-state">
                                            <div class="empty-state-icon" style="background: #eff6ff; color: #3b82f6;">
                                                <i class="fas fa-spinner fa-spin"></i>
                                            </div>
                                            <p class="text-slate-500 font-medium">Đang tải đơn hàng...</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div id="order-modal" class="order-modal-overlay">
        <div class="order-modal-content">
            <div class="modal-header-gradient flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fas fa-receipt"></i>
                        Chi tiết đơn hàng
                    </h3>
                    <p class="text-blue-200 text-sm mt-1">Xem thông tin chi tiết đơn hàng</p>
                </div>
                <button onclick="closeModal()" class="close-btn"><i class="fas fa-times text-lg"></i></button>
            </div>
            <div id="order-detail" class="p-6 sm:p-8"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="admin-layout.js"></script>
    <script src="admin-mobile.js"></script>

    
    <script src="orders.js" defer></script>

</body>
</html>
